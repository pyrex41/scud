<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1e1e2e; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1e1e2e; font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  position: relative; overflow: hidden;
}
.accent-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 6pt;
  background: #89b4fa;
}
.content { text-align: center; z-index: 1; padding: 40pt; }
h1 { color: #cdd6f4; font-size: 54pt; margin: 0 0 12pt 0; font-weight: bold; letter-spacing: 2pt; }
.tagline { color: #89b4fa; font-size: 20pt; margin: 0 0 30pt 0; }
.subtitle { color: #a6adc8; font-size: 14pt; margin: 0; }
.badge {
  background: #313244; border-left: 4pt solid #89b4fa;
  padding: 8pt 16pt; margin-top: 30pt; display: inline-block;
}
.badge p { color: #cdd6f4; font-size: 11pt; margin: 0; }
.corner-accent {
  position: absolute; bottom: 20pt; right: 30pt;
  width: 60pt; height: 60pt; border: 3pt solid #45475a;
  border-radius: 50%; opacity: 0.5;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="corner-accent"></div>
<div class="content">
  <h1>Workshop</h1>
  <p class="tagline">Task Management Process</p>
  <p class="subtitle">AI-powered planning and execution with SCUD</p>
  <div class="badge">
    <p>From PRD to parallel execution</p>
  </div>
</div>
</body>
</html>
