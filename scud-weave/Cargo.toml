[package]
name = "scud-weave"
version = "0.1.0"
edition = "2021"
description = "B-thread coordination layer for multi-agent file conflict prevention"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
anyhow = "1"
globset = "0.4"

[dev-dependencies]
tempfile = "3"
