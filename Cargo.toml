[workspace]
members = ["scud-cli", "scud-core", "descartes-gui"]
resolver = "2"

[workspace.package]
version = "1.65.1"
edition = "2021"
license = "MIT"
authors = ["SCUD Team"]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "advanced"] }
scud-task-core = { version = "1.63.0", path = "scud-core" }