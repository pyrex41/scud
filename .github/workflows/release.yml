name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: scud
            asset_name: scud-linux-x64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: scud
            asset_name: scud-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: scud
            asset_name: scud-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: scud
            asset_name: scud-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: scud.exe
            asset_name: scud-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build
        working-directory: ./scud-cli
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: scud-cli/target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        run: gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          for asset_dir in ./artifacts/*; do
            if [ -d "$asset_dir" ]; then
              asset_name=$(basename "$asset_dir")
              asset_file=$(find "$asset_dir" -type f -name "scud*" | head -1)
              if [ -n "$asset_file" ]; then
                echo "Uploading $asset_file as $asset_name"
                cp "$asset_file" "./$asset_name"
                gh release upload ${{ github.ref_name }} "./$asset_name" --clobber
              fi
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
