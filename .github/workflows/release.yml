name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test with race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: scud-linux-amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset_name: scud-linux-arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset_name: scud-darwin-amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset_name: scud-darwin-arm64
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset_name: scud-windows-amd64.exe
          - os: windows-latest
            goos: windows
            goarch: arm64
            asset_name: scud-windows-arm64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ${{ matrix.asset_name }} ./cmd/scud/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create Release
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        run: |
          notes=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            gh release create "${{ github.ref_name }}" --verify-tag --draft --title "${{ github.ref_name }}" --notes-file "$notes"
          else
            gh release create "${{ github.ref_name }}" --verify-tag --draft --title "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets
        run: |
          for asset_name in scud-linux-amd64 scud-linux-arm64 scud-darwin-amd64 scud-darwin-arm64 scud-windows-amd64.exe scud-windows-arm64.exe; do
            asset_file="./artifacts/$asset_name/$asset_name"
            test -f "$asset_file"
            gh release upload "${{ github.ref_name }}" "$asset_file" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish complete release
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
